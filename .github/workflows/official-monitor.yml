name: Sagrada official monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sagrada-official-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Playwright package
        run: python -m pip install playwright==1.60.0

      - name: Check official ticket availability
        env:
          HEADLESS: '0'
          SEND_ALERTS: '1'
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: xvfb-run -a python official_monitor.py

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sagrada-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 1
