
name: Sagrada official monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Check official ticket availability
        env:
          HEADLESS: '1'
          SEND_ALERTS: '0'
          ALERT_EMAIL: danmeng030106@gmail.com
        run: python official_monitor.py
