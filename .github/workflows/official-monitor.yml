
name: Sagrada official monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Check official ticket availability
        env:
          HEADLESS: '0'
          SEND_ALERTS: '0'
          ALERT_EMAIL: danmeng030106@gmail.com
        run: xvfb-run -a python official_monitor.py

    
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sagrada-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 1

